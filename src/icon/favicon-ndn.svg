<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <style>
    .paper-front { fill: #ffffff; stroke: #111827; }
    .paper-back { fill: #f3f4f6; stroke: #111827; }
    .stroke-main { stroke: #111827; }
    .fill-main { fill: #111827; }
    .pin-outline { stroke: #ffffff; }
    .sketch-thin { stroke: #111827; }
    .sketch-faint { stroke: #9ca3af; }

    @media (prefers-color-scheme: dark) {
      .paper-front { fill: #18181b; stroke: #f4f4f5; }
      .paper-back { fill: #27272a; stroke: #f4f4f5; }
      .stroke-main { stroke: #f4f4f5; }
      .fill-main { fill: #f4f4f5; }
      .pin-outline { stroke: #18181b; }
      .sketch-thin { stroke: #f4f4f5; }
      .sketch-faint { stroke: #71717a; }
    }
  </style>

  <!-- Back stacked paper -->
  <rect x="54" y="64" width="164" height="164" rx="12" fill="#f3f4f6" stroke="#111827" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" class="paper-back" />

  <!-- Front main paper -->
  <rect x="40" y="50" width="164" height="164" rx="12" fill="#ffffff" stroke="#111827" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" class="paper-front" />

  <!-- Solid Pushpin (top center, slightly tilted) -->
  <g transform="translate(132, 46) rotate(14)">
    <path d="M 0 18 L 0 39" fill="none" stroke="#111827" stroke-width="7.5" stroke-linecap="round" class="stroke-main" />
    <path d="M -16 -18 L 16 -18 L 11 -9 L 11 4 L 19 13 L -19 13 L -11 4 L -11 -9 Z" fill="#111827" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" class="fill-main pin-outline" />
  </g>

  <!-- Top-left sketchy circle -->
  <path d="M 78 72 C 92 71, 102 80, 101 91 C 100 102, 87 107, 75 104 C 63 101, 59 89, 64 79 C 69 70, 84 68, 96 74" fill="none" stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round" class="sketch-faint" />
  <path d="M 75 74 C 89 73, 98 81, 97 90 C 96 99, 85 104, 74 101 C 64 98, 61 88, 66 80" fill="none" stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round" class="sketch-faint" />

  <!-- Curved arrow from top-left circle down to NDN -->
  <path d="M 62 93 C 54 103, 55 117, 63 125" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round" class="sketch-thin" />
  <path d="M 58 125 L 64 126 L 64 120" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="sketch-thin" />

  <!-- Top-right small scribbles -->
  <path d="M 164 74 Q 168 71, 171 74 T 178 74 T 185 74" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round" class="sketch-thin" />
  <path d="M 164 81 L 186 81" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round" class="sketch-thin" />
  <path d="M 164 87 L 181 87" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round" class="sketch-thin" />

  <!-- Curved arrow from NDN up toward pin -->
  <path d="M 118 112 C 122 101, 134 94, 147 93" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round" class="sketch-thin" />
  <path d="M 142 90 L 148 93 L 143 97" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="sketch-thin" />

  <!-- Right edge tiny lines -->
  <path d="M 183 156 L 192 156" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round" class="sketch-thin" />
  <path d="M 183 162 L 192 162" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round" class="sketch-thin" />

  <!-- Easter Egg: Natural handwritten "NDN" -->
  <g fill="none" stroke="#111827" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round" class="stroke-main">
    <path d="M 73 151 L 78 122 L 95 150 L 100 121" />
    <path d="M 112 122 L 109 150 C 126 151, 135 143, 136 134 C 137 125, 127 120, 112 122 Z" />
    <path d="M 146 150 L 151 122 L 168 150 L 173 121" />
  </g>

  <!-- Scribble underline beneath NDN -->
  <path d="M 96 161 L 144 158 L 116 166 L 148 164" fill="none" stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="sketch-faint" />

  <!-- Bottom-left wavy scribble -->
  <path d="M 60 174 C 55 184, 57 195, 65 198" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round" class="sketch-thin" />
  <path d="M 70 183 Q 74 180, 77 183 T 84 183 T 91 183" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round" class="sketch-thin" />
  <path d="M 71 190 L 90 190" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round" class="sketch-thin" />
  <path d="M 71 197 L 82 197 M 88 197 L 95 197" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round" class="sketch-thin" />

  <!-- Small circle before checkmark -->
  <circle cx="116" cy="192" r="6.5" fill="none" stroke="#111827" stroke-width="3" class="sketch-thin" />

  <!-- Checkmark -->
  <path d="M 134 191 L 140 198 L 152 183" fill="none" stroke="#111827" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round" class="stroke-main" />

  <!-- Sketchy double circle around Star -->
  <circle cx="172" cy="191" r="15.5" fill="none" stroke="#9ca3af" stroke-width="2.5" class="sketch-faint" />
  <ellipse cx="172" cy="191" rx="14" ry="16" transform="rotate(-18 172 191)" fill="none" stroke="#9ca3af" stroke-width="2.5" class="sketch-faint" />

  <!-- 5-pointed Star -->
  <polygon points="172,181 174.8,187.2 181.5,187.9 176.4,192.4 177.8,199 172,195.5 166.2,199 167.6,192.4 162.5,187.9 169.2,187.2" fill="#111827" stroke="#111827" stroke-width="1.5" stroke-linejoin="round" class="fill-main stroke-main" />
</svg>